<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏰ 每日规划</title>
<style>
:root{--bg:#0f0f13;--s1:#1a1a24;--s2:#24243a;--bd:#2e2e48;--t1:#e8e8f0;--t2:#8888aa;--ac:#6c5ce7;--ac2:#a29bfe;--gn:#00cec9;--og:#fdcb6e;--rd:#ff7675;--pk:#fd79a8;--ppm:2.5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding:20px;user-select:none;-webkit-user-select:none}

.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.hdr h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--ac2),var(--gn));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:12px;color:var(--t2);margin-top:2px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2)}
.btn-g{background:transparent;color:var(--t2);border:1px solid var(--bd)}.btn-g:hover{background:var(--s1);color:var(--t1)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}

.day-bar{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.day-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--t2);cursor:pointer;font-size:11px;font-weight:600;transition:all .2s}
.day-btn:hover{border-color:var(--ac);color:var(--t1)}
.day-btn.active{background:var(--ac);border-color:var(--ac);color:#fff}
.day-btn.today{box-shadow:0 0 0 1px var(--rd)}
.day-sep{width:1px;background:var(--bd);margin:0 4px}

.stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-width:90px}
.stat-v{font-size:18px;font-weight:700}
.stat-l{font-size:10px;color:var(--t2);margin-top:2px}

.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--t2);transition:all .2s}
.tab.active{background:var(--s2);color:var(--t1)}
.tab:hover{color:var(--t1)}

/* === Horizontal Timeline === */
.tl-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;position:relative}
.tl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--bd) transparent;position:relative}
.tl-scroll::-webkit-scrollbar{height:6px}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.tl-ruler{display:flex;height:32px;border-bottom:1px solid var(--bd);position:relative;background:var(--s2)}
.tl-ruler-hour{min-width:calc(var(--ppm) * 60px);text-align:center;font-size:10px;color:var(--t2);font-weight:500;line-height:32px;border-left:1px solid var(--bd);flex-shrink:0}
.tl-ruler-hour:first-child{border-left:none}
.tl-track{position:relative;height:80px;cursor:crosshair;border-top:1px solid var(--bd)}
.tl-tracks{position:relative}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--rd);z-index:20;pointer-events:none}
.tl-grid-line{position:absolute;top:0;bottom:0;width:1px;background:var(--bd);opacity:.5}
.tl-grid-line.half{opacity:.25}
.tl-now::before{content:'';position:absolute;top:-6px;left:-5px;width:12px;height:12px;background:var(--rd);border-radius:50%}
.tl-now-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--rd);font-weight:700;white-space:nowrap}

/* === Plan Card === */
.plan-card{position:absolute;top:8px;height:calc(100% - 16px);border-radius:8px;padding:4px 8px;font-size:11px;cursor:grab;z-index:5;display:flex;flex-direction:column;justify-content:center;overflow:hidden;transition:box-shadow .15s;border-left:3px solid;touch-action:none}
.plan-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.4);z-index:10}
.plan-card.dragging{cursor:grabbing;opacity:.85;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.plan-card.resizing{z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.plan-card.disabled{opacity:.3}
.pc-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-time{font-size:9px;opacity:.7;margin-top:1px;white-space:nowrap}
.pc-actions{position:absolute;top:2px;right:2px;display:none;gap:1px}
.plan-card:hover .pc-actions{display:flex}
.pc-actions button{background:rgba(0,0,0,.4);border:none;color:#fff;width:16px;height:16px;border-radius:3px;cursor:pointer;font-size:8px;line-height:16px;text-align:center}
.pc-actions button:hover{background:rgba(0,0,0,.7)}
.pc-resize{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.pc-resize-l{left:0}
.pc-resize-r{right:0}

/* Color variants */
.plan-card[data-color="accent"]{background:rgba(108,92,231,.2);border-color:var(--ac);color:#d4cfff}
.plan-card[data-color="green"]{background:rgba(0,206,201,.15);border-color:var(--gn);color:#7ff5f2}
.plan-card[data-color="orange"]{background:rgba(253,203,110,.15);border-color:var(--og);color:#f5e0a0}
.plan-card[data-color="pink"]{background:rgba(253,121,168,.15);border-color:var(--pk);color:#ffb0cc}
.plan-card[data-color="red"]{background:rgba(255,118,117,.15);border-color:var(--rd);color:#ffb4b3}

/* Hover tooltip */
.plan-card[data-color="accent"]:hover{background:rgba(108,92,231,.35)}
.plan-card[data-color="green"]:hover{background:rgba(0,206,201,.25)}
.plan-card[data-color="orange"]:hover{background:rgba(253,203,110,.25)}
.plan-card[data-color="pink"]:hover{background:rgba(253,121,168,.25)}
.plan-card[data-color="red"]:hover{background:rgba(255,118,117,.25)}

.tl-hint{font-size:11px;color:var(--t2);text-align:center;padding:8px;border-top:1px solid var(--bd)}

/* List view */
.list-view{display:none}
.list-view.show{display:block}
.list-item{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.list-item:hover{border-color:var(--ac)}
.list-item.disabled{opacity:.4}
.li-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.li-body{flex:1;min-width:0}
.li-name{font-weight:600;font-size:14px}
.li-time{font-size:12px;color:var(--t2);margin-top:2px}
.li-days{font-size:10px;color:var(--ac2);margin-top:2px}
.li-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}

/* Modal */
.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center}
.modal-bg.open{display:flex}
.modal-box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px;width:90%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
.modal-box h2{font-size:17px;margin-bottom:18px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fg input[type="text"],.fg input[type="time"],.fg input[type="number"]{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--t1);font-size:14px;outline:none}
.fg input:focus{border-color:var(--ac)}
.fr{display:flex;gap:12px}
.fr .fg{flex:1}
.color-pick{display:flex;gap:8px}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.color-dot:hover,.color-dot.active{transform:scale(1.2);border-color:#fff}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.ov-hint{font-size:11px;color:var(--og);margin-top:4px;display:none}
.ov-hint.show{display:block}
.days-pick{display:flex;gap:6px;flex-wrap:wrap}
.day-chip{padding:4px 10px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--t2);cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;user-select:none}
.day-chip:hover{border-color:var(--ac);color:var(--t1)}
.day-chip.active{background:var(--ac);border-color:var(--ac);color:#fff}
.days-quick{display:flex;gap:4px;margin-top:6px}
.days-quick button{padding:3px 8px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t2);cursor:pointer;font-size:10px;transition:all .2s}
.days-quick button:hover{border-color:var(--ac);color:var(--t1)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 18px;font-size:12px;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.empty{text-align:center;padding:60px 20px;color:var(--t2)}
.empty .icon{font-size:40px;margin-bottom:8px}
.path-hint{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.path-label{color:var(--t2);font-weight:600}
.path-hint code{background:var(--bg);padding:3px 8px;border-radius:4px;color:var(--ac2);font-size:11px;word-break:break-all;flex:1;min-width:0}

@media(max-width:600px){
  body{padding:12px}
  .hdr h1{font-size:18px}
  .plan-card .pc-time{display:none}
  .day-btn{padding:4px 8px;font-size:10px}
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>⏰ 每日规划</h1>
    <div class="hdr-sub">拖拽卡片在时间轴上规划你的每一天</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-p" onclick="openModal()">+ 新建</button>
  </div>
</div>

<div class="stats" id="stats"></div>
<div class="day-bar" id="dayBar"></div>

<div class="tabs">
  <button class="tab active" id="tabTl" onclick="switchTab('tl')">📊 时间线</button>
  <button class="tab" id="tabLst" onclick="switchTab('lst')">📋 列表</button>
</div>

<!-- Timeline View -->
<div id="viewTl">
  <div class="tl-wrap">
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-ruler" id="tlRuler"></div>
      <div class="tl-tracks" id="tlTracks">
        <div class="tl-track" data-lane="0"></div>
        <div class="tl-track" data-lane="1"></div>
        <div class="tl-track" data-lane="2"></div>
      </div>
    </div>
    <div class="tl-hint">💡 点击空白处新建 · 拖拽卡片移动 · 拖拽边缘调整时长 · 卡片自动分配轨道</div>
  </div>
</div>

<!-- List View -->
<div class="list-view" id="viewLst"></div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h2 id="modalTitle">新建规划</h2>
    <input type="hidden" id="editId">
    <div class="fg">
      <label>事项名称</label>
      <input type="text" id="fName" placeholder="做什么...">
    </div>
    <div class="fr">
      <div class="fg">
        <label>开始时间</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="time" id="fStart" style="flex:1">
          <button type="button" class="btn btn-g btn-sm" onclick="setMidnight('fStart')">🌙00:00</button>
        </div>
      </div>
      <div class="fg">
        <label>结束时间</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="time" id="fEnd" style="flex:1">
          <button type="button" class="btn btn-g btn-sm" onclick="setMidnight('fEnd')">🌙00:00</button>
        </div>
      </div>
    </div>
    <div class="ov-hint" id="ovHint">💡 结束时间 ≤ 开始时间表示跨天到第二天</div>
    <div class="fg">
      <label>适用日期</label>
      <div class="days-pick" id="daysPick">
        <div class="day-chip active" data-d="1" onclick="toggleDayChip(this)">周一</div>
        <div class="day-chip active" data-d="2" onclick="toggleDayChip(this)">周二</div>
        <div class="day-chip active" data-d="3" onclick="toggleDayChip(this)">周三</div>
        <div class="day-chip active" data-d="4" onclick="toggleDayChip(this)">周四</div>
        <div class="day-chip active" data-d="5" onclick="toggleDayChip(this)">周五</div>
        <div class="day-chip active" data-d="6" onclick="toggleDayChip(this)">周六</div>
        <div class="day-chip active" data-d="0" onclick="toggleDayChip(this)">周日</div>
      </div>
      <div class="days-quick">
        <button onclick="setDaysQuick('weekdays')">工作日</button>
        <button onclick="setDaysQuick('weekend')">周末</button>
        <button onclick="setDaysQuick('all')">全部</button>
      </div>
    </div>
    <div class="fg">
      <label>分类</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="btn btn-g btn-sm" onclick="setCat('工作')">工作</button>
        <button type="button" class="btn btn-g btn-sm" onclick="setCat('学习')">学习</button>
        <button type="button" class="btn btn-g btn-sm" onclick="setCat('生活')">生活</button>
        <button type="button" class="btn btn-g btn-sm" onclick="setCat('运动')">运动</button>
        <button type="button" class="btn btn-g btn-sm" onclick="setCat('休息')">休息</button>
      </div>
      <input type="text" id="fCat" placeholder="输入分类名称..." style="margin-top:6px">
    </div>
    <div class="fg">
      <label>颜色</label>
      <div class="color-pick">
        <div class="color-dot active" style="background:var(--ac)" data-c="accent" onclick="pickColor(this)"></div>
        <div class="color-dot" style="background:var(--gn)" data-c="green" onclick="pickColor(this)"></div>
        <div class="color-dot" style="background:var(--og)" data-c="orange" onclick="pickColor(this)"></div>
        <div class="color-dot" style="background:var(--pk)" data-c="pink" onclick="pickColor(this)"></div>
        <div class="color-dot" style="background:var(--rd)" data-c="red" onclick="pickColor(this)"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-g" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== Data ===== */
var routine = [];
var selColor = 'accent';
var selectedDay = -1;
var DAY_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];
var PPM = 2.5; // pixels per minute
var MIN_CARD_MINUTES = 15;

/* ===== Load/Save ===== */
var serverMode = false;
var SERVER = 'http://127.0.0.1:19831';

function loadData() {
  return fetch(SERVER + '/routine').then(function(r){return r.json();}).then(function(d) {
    serverMode = true;
    routine = (d.routine || []).map(function(r) {
      return {
        id: r.id,
        name: r.activity || r.name || '',
        start: r.start,
        end: r.end,
        color: r.color,
        category: r.category || '',
        days: r.days || [0,1,2,3,4,5,6],
        disabled: r.enabled === false ? true : (r.disabled || false)
      };
    });
  }).catch(function() {
    serverMode = false;
    try {
      var s = localStorage.getItem('daily-routine');
      routine = s ? JSON.parse(s) : [];
    } catch(e) { routine = []; }
  }).then(function() {
    for (var i = 0; i < routine.length; i++) {
      if (!routine[i].days) routine[i].days = [0,1,2,3,4,5,6];
    }
  });
}

function saveData() {
  if (serverMode) {
    var data = {
      routine: routine.map(function(r) {
        return {
          id: r.id,
          activity: r.name,
          start: r.start,
          end: r.end,
          color: r.color,
          category: r.category || '',
          days: r.days,
          enabled: !r.disabled,
          overnight: false
        };
      }),
      syncedAt: new Date().toISOString()
    };
    fetch(SERVER + '/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).catch(function(e) { console.error('Sync failed:', e); });
  } else {
    localStorage.setItem('daily-routine', JSON.stringify(routine));
  }
}
function getFiltered() {
  var dow = selectedDay === -1 ? new Date().getDay() : selectedDay;
  return routine.filter(function(r) { return r.days && r.days.indexOf(dow) !== -1; });
}

/* ===== Time helpers ===== */
function t2m(t) {
  var p = t.split(':');
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}
function m2t(m) {
  m = ((m % 1440) + 1440) % 1440;
  return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function m2x(m) { return m * PPM; }
function x2m(x) { return Math.round(x / PPM); }
function snap(m, step) { return Math.round(m / step) * step; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function durStr(s, e) {
  var d = t2m(e) - t2m(s);
  if (d <= 0) d += 1440;
  var h = Math.floor(d / 60), m = d % 60;
  return h > 0 ? h + 'h' + (m > 0 ? m + 'm' : '') : m + 'm';
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

/* ===== Init ===== */
var sc, vw, tracksContainer;

loadData().then(function() {
  // Build ruler first
  (function() {
    var ruler = document.getElementById('tlRuler');
    var html = '';
    for (var h = 0; h < 24; h++) {
      html += '<div class="tl-ruler-hour" style="width:' + (PPM * 60) + 'px">' + pad(h) + ':00</div>';
    }
    ruler.style.width = (PPM * 1440) + 'px';
    ruler.innerHTML = html;
  })();

  // Build grid on each track
  (function() {
    var tracks = document.querySelectorAll('.tl-track');
    var tw = (PPM * 1440) + 'px';
    for (var t = 0; t < tracks.length; t++) {
      tracks[t].style.width = tw;
      var html = '';
      for (var h = 0; h <= 24; h++) {
        html += '<div class="tl-grid-line" style="left:' + (h * PPM * 60) + 'px"></div>';
        if (h < 24) html += '<div class="tl-grid-line half" style="left:' + (h * PPM * 60 + PPM * 30) + 'px"></div>';
      }
      tracks[t].innerHTML = html;
    }
    var container = document.getElementById('tlTracks');
    container.style.width = tw;
    var nowEl = document.createElement('div');
    nowEl.className = 'tl-now';
    nowEl.id = 'tlNow';
    container.appendChild(nowEl);
  })();

  // Center on current time
  sc = document.getElementById('tlScroll');
  vw = sc.clientWidth;
  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  sc.scrollLeft = m2x(nowMin) - vw / 2;

  // Now render data
  renderDayBar();
  renderAll();
  setInterval(updateNow, 1000);

  // Double-click to create on any track
  tracksContainer = document.getElementById('tlTracks');
  tracksContainer.addEventListener('dblclick', function(e) {
    if (e.target.closest('.plan-card')) return;
    var track = e.target.closest('.tl-track');
    if (!track) return;
    var rect = track.getBoundingClientRect();
    var x = e.clientX - rect.left + sc.scrollLeft;
    var m = snap(x2m(x), 15);
    document.getElementById('fStart').value = m2t(m);
    document.getElementById('fEnd').value = m2t(m + 60);
    openModal();
  });

}); // end loadData().then()

/* ===== Render ===== */
function renderAll() {
  renderTimeline();
  renderList();
  renderStats();
  updateNow();
}

function renderTimeline() {
  var tracks = document.querySelectorAll('.tl-track');
  for (var t = 0; t < tracks.length; t++) {
    var old = tracks[t].querySelectorAll('.plan-card');
    for (var j = 0; j < old.length; j++) old[j].remove();
  }

  var items = getFiltered();
  items.sort(function(a, b) { return t2m(a.start) - t2m(b.start); });

  var laneEnds = [];
  for (var t = 0; t < tracks.length; t++) laneEnds.push(0);

  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    var s = t2m(r.start), e = t2m(r.end);
    if (e <= s) e += 1440;

    var lane = 0;
    for (var t = 0; t < tracks.length; t++) {
      if (s >= laneEnds[t]) { lane = t; break; }
      if (t === tracks.length - 1) lane = t;
    }
    laneEnds[lane] = e;

    var left = m2x(s);
    var w = m2x(e - s);
    if (w < 12) w = 12;

    var card = document.createElement('div');
    card.className = 'plan-card' + (r.disabled ? ' disabled' : '');
    card.setAttribute('data-color', r.color || 'accent');
    card.setAttribute('data-id', r.id);
    card.style.left = left + 'px';
    card.style.width = w + 'px';
    card.innerHTML =
      '<div class="pc-resize pc-resize-l"></div>' +
      '<div class="pc-resize pc-resize-r"></div>' +
      '<div class="pc-title">' + esc(r.name) + '</div>' +
      '<div class="pc-time">' + r.start + ' - ' + r.end + '</div>' +
      '<div class="pc-actions">' +
        '<button onclick="event.stopPropagation();toggleDisable(\'' + r.id + '\')" title="启用/禁用">⚡</button>' +
        '<button onclick="event.stopPropagation();editItem(\'' + r.id + '\')" title="编辑">✏️</button>' +
        '<button onclick="event.stopPropagation();deleteItem(\'' + r.id + '\')" title="删除">🗑</button>' +
      '</div>';
    card.addEventListener('pointerdown', onCardPointerDown);
    tracks[lane].appendChild(card);
  }
}

function renderList() {
  var el = document.getElementById('viewLst');
  var items = getFiltered();
  if (!items.length) {
    el.innerHTML = '<div class="empty"><div class="icon">📭</div><div>还没有规划</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    html += '<div class="list-item' + (r.disabled ? ' disabled' : '') + '">' +
      '<div class="li-dot" style="background:var(--' + colorVar(r.color) + ')"></div>' +
      '<div class="li-body"><div class="li-name">' + esc(r.name) + '</div>' +
      '<div class="li-time">' + r.start + ' → ' + r.end + ' (' + durStr(r.start, r.end) + ')</div>' +
      (r.category ? '<div class="li-days">' + esc(r.category) + '</div>' : '') +
      '</div><div class="li-actions">' +
      '<button class="btn btn-g btn-sm" onclick="toggleDisable(\'' + r.id + '\')">' + (r.disabled ? '启用' : '禁用') + '</button>' +
      '<button class="btn btn-g btn-sm" onclick="editItem(\'' + r.id + '\')">编辑</button>' +
      '<button class="btn btn-g btn-sm" onclick="deleteItem(\'' + r.id + '\')">删除</button>' +
      '</div></div>';
  }
  el.innerHTML = html;
}

function renderStats() {
  var items = getFiltered().filter(function(r){return !r.disabled;});
  var total = 0;
  for (var i = 0; i < items.length; i++) {
    var d = t2m(items[i].end) - t2m(items[i].start);
    if (d <= 0) d += 1440;
    total += d;
  }
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="stat-v">' + items.length + '</div><div class="stat-l">规划数</div></div>' +
    '<div class="stat"><div class="stat-v">' + Math.floor(total/60) + 'h' + (total%60) + 'm</div><div class="stat-l">总时长</div></div>';
}

function updateNow() {
  var now = new Date();
  var nm = now.getHours() * 60 + now.getMinutes();
  var nl = document.getElementById('tlNow');
  if (nl) {
    nl.style.left = m2x(nm) + 'px';
    var lbl = nl.querySelector('.tl-now-label');
    if (lbl) {
      lbl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    } else {
      nl.innerHTML = '<div class="tl-now-label">' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '</div>';
    }
  }
}

/* ===== Card Drag & Resize ===== */
var drag = null; // {card, id, mode:'move'|'resize-l'|'resize-r', startX, origLeft, origWidth, minLeft, maxRight}

function onCardPointerDown(e) {
  var card = e.currentTarget;
  var mode = 'move';
  if (e.target.classList.contains('pc-resize-l')) mode = 'resize-l';
  else if (e.target.classList.contains('pc-resize-r')) mode = 'resize-r';
  if (e.target.closest('.pc-actions')) return;

  e.preventDefault();
  e.stopPropagation();
  card.setPointerCapture(e.pointerId);

  var track = card.parentElement;
  var rect = track.getBoundingClientRect();
  var id = card.getAttribute('data-id');
  var r = routine.find(function(x){return x.id===id;});
  if (!r) return;

  var s = t2m(r.start), ed = t2m(r.end);
  if (ed <= s) ed += 1440;

  // Cache all track rects for cross-track detection
  var allTracks = document.querySelectorAll('.tl-track');
  var trackRects = [];
  for (var i = 0; i < allTracks.length; i++) {
    var tr = allTracks[i].getBoundingClientRect();
    trackRects.push({ el: allTracks[i], top: tr.top, bottom: tr.bottom });
  }

  drag = {
    card: card, id: id, mode: mode, pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    origLeft: m2x(s),
    origWidth: m2x(ed - s),
    origStart: s, origEnd: ed,
    trackLeft: rect.left,
    scStart: sc.scrollLeft,
    trackRects: trackRects,
    currentTrack: track
  };

  card.classList.add(mode === 'move' ? 'dragging' : 'resizing');
  document.addEventListener('pointermove', onCardPointerMove);
  document.addEventListener('pointerup', onCardPointerUp);
}

function onCardPointerMove(e) {
  if (!drag) return;
  e.preventDefault();

  // Cross-track: move card to track under mouse
  if (drag.mode === 'move' && drag.trackRects) {
    var mouseY = e.clientY;
    for (var i = 0; i < drag.trackRects.length; i++) {
      var tr = drag.trackRects[i];
      if (mouseY >= tr.top && mouseY <= tr.bottom && tr.el !== drag.currentTrack) {
        tr.el.appendChild(drag.card);
        drag.currentTrack = tr.el;
        break;
      }
    }
  }

  var dx = e.clientX - drag.startX;
  var dmin = Math.round(dx / PPM);

  if (drag.mode === 'move') {
    var newStart = snap(clamp(drag.origStart + dmin, 0, 1440 - MIN_CARD_MINUTES), 5);
    var dur = drag.origEnd - drag.origStart;
    var newEnd = newStart + dur;
    if (newEnd > 1440) { newEnd = 1440; newStart = newEnd - dur; }
    drag.card.style.left = m2x(newStart) + 'px';
    var timeEl = drag.card.querySelector('.pc-time');
    if (timeEl) timeEl.textContent = m2t(newStart) + ' - ' + m2t(newEnd);
  } else if (drag.mode === 'resize-r') {
    var newEnd = snap(clamp(drag.origEnd + dmin, drag.origStart + MIN_CARD_MINUTES, 1440), 5);
    drag.card.style.width = m2x(newEnd - drag.origStart) + 'px';
    var timeEl = drag.card.querySelector('.pc-time');
    if (timeEl) timeEl.textContent = m2t(drag.origStart) + ' - ' + m2t(newEnd);
  } else if (drag.mode === 'resize-l') {
    var newStart = snap(clamp(drag.origStart + dmin, 0, drag.origEnd - MIN_CARD_MINUTES), 5);
    drag.card.style.left = m2x(newStart) + 'px';
    drag.card.style.width = m2x(drag.origEnd - newStart) + 'px';
    var timeEl = drag.card.querySelector('.pc-time');
    if (timeEl) timeEl.textContent = m2t(newStart) + ' - ' + m2t(drag.origEnd);
  }
}

function onCardPointerUp(e) {
  if (!drag) return;
  e.preventDefault();

  drag.card.classList.remove('dragging', 'resizing');
  drag.card.releasePointerCapture(drag.pointerId);

  // Calculate final time from card position
  var left = parseFloat(drag.card.style.left);
  var width = parseFloat(drag.card.style.width);
  var finalStart = snap(x2m(left), 5);
  var finalDur = Math.round(width / PPM);
  if (finalDur < MIN_CARD_MINUTES) finalDur = MIN_CARD_MINUTES;
  var finalEnd = finalStart + finalDur;

  // Update data
  var r = routine.find(function(x){return x.id===drag.id;});
  if (r) {
    r.start = m2t(finalStart);
    r.end = m2t(finalEnd > 1440 ? finalEnd - 1440 : finalEnd);
    saveData();
  }

  document.removeEventListener('pointermove', onCardPointerMove);
  document.removeEventListener('pointerup', onCardPointerUp);
  drag = null;
  renderAll();
}

/* ===== Modal ===== */
function openModal(startPrefill) {
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fStart').value = startPrefill || '';
  document.getElementById('fEnd').value = '';
  document.getElementById('fCat').value = '';
  document.getElementById('modalTitle').textContent = '新建规划';
  selColor = 'accent';
  updateColorPick();
  var chips = document.querySelectorAll('.day-chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.add('active');
  document.getElementById('modalBg').classList.add('open');
  if (!startPrefill) document.getElementById('fName').focus();
}

function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

function editItem(id) {
  var r = routine.find(function(x){return x.id===id;});
  if (!r) return;
  document.getElementById('editId').value = r.id;
  document.getElementById('fName').value = r.name;
  document.getElementById('fStart').value = r.start;
  document.getElementById('fEnd').value = r.end;
  document.getElementById('fCat').value = r.category || '';
  document.getElementById('modalTitle').textContent = '编辑规划';
  selColor = r.color || 'accent';
  updateColorPick();
  var chips = document.querySelectorAll('.day-chip');
  for (var i = 0; i < chips.length; i++) {
    var d = parseInt(chips[i].getAttribute('data-d'));
    chips[i].classList.toggle('active', r.days.indexOf(d) !== -1);
  }
  document.getElementById('modalBg').classList.add('open');
}

function saveItem() {
  var name = document.getElementById('fName').value.trim();
  var start = document.getElementById('fStart').value;
  var end = document.getElementById('fEnd').value;
  var cat = document.getElementById('fCat').value.trim();
  if (!name) { toast('请输入名称'); return; }
  if (!start || !end) { toast('请设置时间'); return; }

  var days = [];
  var chips = document.querySelectorAll('.day-chip.active');
  for (var i = 0; i < chips.length; i++) days.push(parseInt(chips[i].getAttribute('data-d')));
  if (!days.length) { toast('请至少选一天'); return; }

  var editId = document.getElementById('editId').value;
  if (editId) {
    var r = routine.find(function(x){return x.id===editId;});
    if (r) { r.name = name; r.start = start; r.end = end; r.color = selColor; r.category = cat; r.days = days; }
  } else {
    routine.push({ id: uid(), name: name, start: start, end: end, color: selColor, category: cat, days: days });
  }
  saveData();
  closeModal();
  renderAll();
  toast(editId ? '已更新' : '已添加');
}

function deleteItem(id) {
  if (!confirm('确定删除？')) return;
  routine = routine.filter(function(r){return r.id !== id;});
  saveData();
  renderAll();
  toast('已删除');
}

function toggleDisable(id) {
  var r = routine.find(function(x){return x.id===id;});
  if (r) { r.disabled = !r.disabled; saveData(); renderAll(); }
}

/* ===== UI Helpers ===== */
function selectDay(d) { selectedDay = d; renderDayBar(); renderAll(); }
function renderDayBar() {
  var bar = document.getElementById('dayBar');
  var today = new Date().getDay();
  var h = '<button class="day-btn' + (selectedDay===-1?' active':'') + '" onclick="selectDay(-1)">今天</button><div class="day-sep"></div>';
  for (var d=1;d<=6;d++) h += '<button class="day-btn'+(selectedDay===d?' active':'')+(d===today?' today':'')+'" onclick="selectDay('+d+')">'+DAY_NAMES[d]+'</button>';
  h += '<button class="day-btn'+(selectedDay===0?' active':'')+(0===today?' today':'')+'" onclick="selectDay(0)">'+DAY_NAMES[0]+'</button>';
  bar.innerHTML = h;
}
function switchTab(v) {
  document.getElementById('viewTl').style.display = v==='tl'?'block':'none';
  document.getElementById('viewLst').classList.toggle('show', v==='lst');
  document.getElementById('tabTl').classList.toggle('active', v==='tl');
  document.getElementById('tabLst').classList.toggle('active', v==='lst');
}
function pickColor(el) {
  selColor = el.getAttribute('data-c');
  updateColorPick();
}
function updateColorPick() {
  var dots = document.querySelectorAll('.color-dot');
  for (var i=0;i<dots.length;i++) dots[i].classList.toggle('active', dots[i].getAttribute('data-c')===selColor);
}
function setCat(c) { document.getElementById('fCat').value = c; }
function toggleDayChip(el) { el.classList.toggle('active'); }
function setDaysQuick(t) {
  var chips = document.querySelectorAll('.day-chip');
  for (var i=0;i<chips.length;i++) {
    var d = parseInt(chips[i].getAttribute('data-d'));
    if (t==='all') chips[i].classList.add('active');
    else if (t==='weekdays') chips[i].classList.toggle('active', d>=1&&d<=5);
    else if (t==='weekend') chips[i].classList.toggle('active', d===0||d===6);
  }
}
function setMidnight(fieldId) { document.getElementById(fieldId).value = '00:00'; }
function colorVar(c) {
  var map = {accent:'ac',green:'gn',orange:'og',pink:'pk',red:'rd'};
  return map[c]||'ac';
}
function esc(s) { var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');}, 2000);
}
</script>
